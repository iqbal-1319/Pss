version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: iqbal_user
      WORDPRESS_DB_PASSWORD: password_iqbal
      # Konfigurasi tambahan untuk Redis (Bonus)
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
    depends_on:
      - mysql
      - redis
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - wp_network

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root_password_aman
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: iqbal_user
      MYSQL_PASSWORD: password_iqbal
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wp_network

  redis:
    image: redis:alpine
    networks:
      - wp_network

volumes:
  wordpress_files:
  mysql_data:

networks:
  wp_network:
    driver: bridge